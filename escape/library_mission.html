(()=>{'use strict';const answers=new Set([1,3,5,7,8,9,11,12,13,15,17,19,20,21,23]);const opened=new Set();const wrap=document.getElementById('tiles');const remain=document.getElementById('remaining');const counter=document.getElementById('opened');const reveal=document.getElementById('reveal');const secret=document.getElementById('secret');const buttons=[];function update(){const left=[...answers].filter(n=>!opened.has(n)).length;remain.textContent=`정답까지 남은 칸: ${left}칸`;counter.textContent=`열린 칸: ${opened.size} / 36`;const unlocked=opened.size>=8;reveal.disabled=!unlocked;reveal.textContent=unlocked?'전체 공개 가능':`전체 공개 잠김 (${opened.size}/8)`;secret.classList.toggle('success',left===0);secret.innerHTML=left===0?'<strong>🔓 암호 공개!</strong><div class="answer">바</div>':'<strong>🔒 암호 잠김</strong><p class="muted">정답 칸 15개를 찾으세요</p>'}function openTile(n){opened.add(n);buttons[n-1].classList.add('open');buttons[n-1].setAttribute('aria-pressed','true');update()}for(let i=1;i<=36;i++){let b=document.createElement('button');b.type='button';b.className='tile';b.textContent=i;b.setAttribute('aria-label',`${i}번 그림 열기`);b.setAttribute('aria-pressed','false');b.addEventListener('click',()=>openTile(i));wrap.append(b);buttons.push(b)}document.getElementById('reset').addEventListener('click',()=>{opened.clear();buttons.forEach(b=>{b.classList.remove('open');b.setAttribute('aria-pressed','false')});update()});reveal.addEventListener('click',()=>{if(opened.size<8)return;for(let i=1;i<=36;i++)openTile(i)});document.getElementById('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement){await document.exitFullscreen()}else if(document.documentElement.requestFullscreen){await document.documentElement.requestFullscreen()}}catch(e){alert('이 브라우저에서는 전체 화면 기능을 지원하지 않을 수 있습니다.')}});update()})();
