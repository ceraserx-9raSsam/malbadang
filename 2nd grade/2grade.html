<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2학년 나만의 말바당 그림사전</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:'Noto Sans KR','Malgun Gothic',sans-serif;background:#f7faf8;color:#203a32}.wrap{max-width:980px;margin:auto;padding:54px 20px 70px}header{text-align:center;margin-bottom:34px}.eyebrow{color:#3b8869;font-size:14px;font-weight:800;letter-spacing:1px}h1{font-size:clamp(26px,5vw,40px);margin:12px 0}header p{font-size:16px;color:#62746e;line-height:1.6}.books{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}.book{border:1px solid #e2ebe5;border-radius:20px;background:white;box-shadow:0 7px 25px rgba(22,68,49,.07);padding:23px 16px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;text-decoration:none;color:inherit;transition:transform .18s,box-shadow .18s;min-height:265px}.book:hover{transform:translateY(-5px);box-shadow:0 14px 30px rgba(22,68,49,.13)}.cover{width:110px;height:134px;border-radius:7px 14px 14px 7px;display:flex;align-items:center;justify-content:center;font-size:46px;box-shadow:5px 5px 0 rgba(0,0,0,.07);border-left:8px solid rgba(0,0,0,.13)}.book:nth-child(1) .cover{background:#d8f0e0}.book:nth-child(2) .cover{background:#ffebcd}.book:nth-child(3) .cover{background:#dce8ff}.book:nth-child(4) .cover{background:#f9deed}.book strong{font-size:17px}.book span.button{font-size:14px;background:#247b58;color:white;font-weight:700;padding:9px 17px;border-radius:20px;margin-top:auto}.book[data-pending="true"]{cursor:default}.book[data-pending="true"] span.button{background:#899991}.notice{text-align:center;font-size:13px;color:#788880;margin-top:26px}@media(max-width:720px){.books{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:380px){.books{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="wrap">
<header><div class="eyebrow">2026 CHUJA ELEMENTARY SCHOOL · 말바당 프로그램</div><h1>2학년 나만의 말바당 그림사전</h1><p>우리 손으로 만든 제주어 그림사전 네 권을 만나 보세요.<br>책을 누르면 Heyzine 전자책으로 바로 연결됩니다.</p></header>
<section class="books" aria-label="2학년 학생 그림사전 4권">
<!-- 학생별 Heyzine 전자책 바로가기 -->
<a class="book" href="https://heyzine.com/flip-book/1deddfedb1.html" target="_blank" rel="noopener noreferrer" aria-label="Kim J.A 그림사전 읽기"><div class="cover">📗</div><strong>Kim J.A의 그림사전</strong><span class="button">전자책 읽기 ↗</span></a>
<a class="book" href="https://heyzine.com/flip-book/b38a9f7c7e.html" target="_blank" rel="noopener noreferrer" aria-label="Park S.H. 그림사전 읽기"><div class="cover">📙</div><strong>Park S.H.의 그림사전</strong><span class="button">전자책 읽기 ↗</span></a>
<a class="book" href="https://heyzine.com/flip-book/f3e175fcbb.html" target="_blank" rel="noopener noreferrer" aria-label="Won S.Y. 그림사전 읽기"><div class="cover">📘</div><strong>Won S.Y.의 그림사전</strong><span class="button">전자책 읽기 ↗</span></a>
<a class="book" href="https://heyzine.com/flip-book/bce78796ea.html" target="_blank" rel="noopener noreferrer" aria-label="Yoon S.B. 그림사전 읽기"><div class="cover">📕</div><strong>Yoon S.B.의 그림사전</strong><span class="button">전자책 읽기 ↗</span></a>
</section><p class="notice">※ 그림사전을 누르면 Heyzine 전자책이 새 탭에서 열립니다.</p>
</main>
<script>
// 등록된 Heyzine 주소는 새 탭에서 바로 엽니다. 빈 링크는 이동하지 않습니다.
for(const a of document.querySelectorAll('.book')){
 if(a.getAttribute('href')==='#'){
  a.dataset.pending='true';a.querySelector('.button').textContent='링크 준비 중';a.addEventListener('click',e=>e.preventDefault());
 } else {a.removeAttribute('data-pending');a.setAttribute('target','_blank');a.setAttribute('rel','noopener noreferrer');}
}
</script>
</body></html>
